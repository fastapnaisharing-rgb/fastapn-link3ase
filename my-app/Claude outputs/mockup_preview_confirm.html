<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup หน้ายืนยันก่อนบันทึก</title>
<style>
  :root{
    --bg:#eef1f5; --card:#fff; --ink:#1f2328; --mute:#656d76; --line:#e6e9ed;
    --blue:#0969da; --blue-soft:#ddf0ff; --green:#1a7f37; --green-soft:#e6f4ea;
    --amber:#9a6700; --amber-soft:#fff4d6; --gray-soft:#f3f4f6; --red:#cf222e; --red-soft:#ffebe9;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:"Sarabun","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);padding:24px 16px 48px}
  .switch{display:flex;gap:8px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
  .switch button{border:1px solid #cfd6de;background:#fff;border-radius:999px;padding:7px 16px;font:inherit;font-size:13px;cursor:pointer;color:var(--mute)}
  .switch button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .modal{width:760px;max-width:100%;margin:0 auto;background:var(--card);border-radius:16px;box-shadow:0 12px 40px rgba(20,30,50,.18);overflow:hidden}
  .head{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--line)}
  .head h2{margin:0;font-size:16px;font-weight:600}
  .x{border:0;background:none;font-size:18px;color:var(--mute);cursor:pointer;line-height:1}
  .body{padding:20px 24px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:5px 12px;border-radius:999px;background:var(--gray-soft);color:var(--ink)}
  .chip b{font-weight:600}
  .chip.type{background:var(--blue-soft);color:var(--blue);font-weight:600}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
  .stat{border-radius:12px;padding:12px 14px;background:var(--gray-soft)}
  .stat small{display:block;font-size:12px;color:var(--mute);margin-bottom:2px}
  .stat strong{font-size:24px;font-weight:600;line-height:1.2}
  .stat.zero strong{color:#b6bcc4}
  .stat.new{background:var(--green-soft)} .stat.new strong{color:var(--green)}
  .stat.upd{background:var(--blue-soft)} .stat.upd strong{color:var(--blue)}
  .stat.prot{background:var(--amber-soft)} .stat.prot strong{color:var(--amber)}
  .stat.bad{background:var(--red-soft)} .stat.bad strong{color:var(--red)}
  .stat.zero{background:var(--gray-soft)}
  .notice{display:flex;gap:10px;align-items:center;background:var(--green-soft);color:#14532d;border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:16px}
  .notice .ic{width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
  .bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:13px;color:var(--mute)}
  .tog{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
  .tog input{display:none}
  .tog i{width:34px;height:20px;border-radius:999px;background:#c8cfd8;position:relative;transition:.15s}
  .tog i:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
  .tog input:checked+i{background:var(--blue)} .tog input:checked+i:after{left:16px}
  .tablewrap{border:1px solid var(--line);border-radius:12px;max-height:300px;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{position:sticky;top:0;background:#f7f8fa;text-align:left;font-weight:600;color:var(--mute);padding:9px 12px;font-size:12px;border-bottom:1px solid var(--line)}
  td{padding:9px 12px;border-bottom:1px solid #f0f2f5}
  tr:last-child td{border-bottom:0}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .old{color:var(--mute)}
  .delta{font-size:12px;margin-left:6px}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .pill.new{background:var(--green-soft);color:var(--green)}
  .pill.upd{background:var(--blue-soft);color:var(--blue)}
  .pill.prot{background:var(--amber-soft);color:var(--amber)}
  .pill.same{background:var(--gray-soft);color:var(--mute);font-weight:500}
  tr.same td{color:var(--mute)}
  .empty{padding:28px 16px;text-align:center;color:var(--mute);font-size:14px}
  .empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px;border-top:1px solid var(--line);background:#fafbfc}
  .foot .hint{font-size:12px;color:var(--mute)}
  .btns{display:flex;gap:8px}
  .btn{font:inherit;font-size:14px;border-radius:10px;padding:9px 18px;cursor:pointer;border:1px solid #cfd6de;background:#fff;color:var(--ink)}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
  .note{max-width:760px;margin:16px auto 0;font-size:12px;color:var(--mute);text-align:center}
  @media (max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}.foot{flex-direction:column;align-items:stretch}.btns{justify-content:flex-end}}
</style>
</head>
<body>

<div class="switch">
  <button id="b1" class="on" onclick="show(1)">กรณีไม่มีรายการเปลี่ยน (แบบในภาพของคุณ)</button>
  <button id="b2" onclick="show(2)">กรณีมีรายการใหม่/เปลี่ยน</button>
</div>

<div class="modal">
  <div class="head">
    <h2>ยืนยันข้อมูลก่อนบันทึก</h2>
    <button class="x" aria-label="ปิด">✕</button>
  </div>

  <div class="body">
    <div class="chips">
      <span class="chip type">Trial Balance (TB)</span>
      <span class="chip">BU <b>0402</b></span>
      <span class="chip">Period <b>2026-09</b></span>
      <span class="chip">ทั้งหมด <b id="total">56</b> รายการ</span>
    </div>

    <div class="stats" id="stats"></div>

    <div id="notice"></div>

    <div class="bar">
      <span id="barL"></span>
      <label class="tog"><input type="checkbox" id="showSame" onchange="render()"><i></i><span id="togT"></span></label>
    </div>

    <div class="tablewrap">
      <table>
        <thead><tr>
          <th>สาขา</th><th>Account</th><th class="num">ยอดเดิม</th><th class="num">ยอดใหม่</th><th>สถานะ</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty"></div>
    </div>
  </div>

  <div class="foot">
    <span class="hint" id="hint"></span>
    <div class="btns">
      <button class="btn">ยกเลิก</button>
      <button class="btn primary" id="ok">ยืนยันบันทึกลง DB</button>
    </div>
  </div>
</div>
<p class="note">Mockup เพื่อดูหน้าตาเท่านั้น — ยังไม่ได้แก้โค้ดจริง ตัวเลขเป็นข้อมูลตัวอย่าง</p>

<script>
  const fmt = n => n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const same = [["040214",-29051.37],["040215",-106759.25],["040216",27746.00],["040217",6556.58],["0402H1",-363459.75],["0402W1",-429252.24],["0402W2",-775293.78],["0402Y1",0]]
    .map(([b,v])=>({b,a:"21930054",o:v,n:v,s:"same"}));
  const scen = {
    1:{ stats:{new:0,upd:0,prot:0,bad:0}, same:56, changed:[] },
    2:{ stats:{new:2,upd:2,prot:1,bad:0}, same:51, changed:[
      {b:"0402W3",a:"11610752",o:null,n:12480.00,s:"new"},
      {b:"0402W4",a:"11610752",o:null,n:3150.50,s:"new"},
      {b:"0402H2",a:"11610752",o:2728.50,n:3012.10,s:"upd"},
      {b:"0402H3",a:"21930054",o:-13375.00,n:-14200.00,s:"upd"},
      {b:"0402Y1",a:"11610755",o:5400.00,n:0,s:"prot"} ] }
  };
  let cur = 1;
  function show(k){cur=k;document.getElementById('b1').classList.toggle('on',k==1);document.getElementById('b2').classList.toggle('on',k==2);document.getElementById('showSame').checked=false;render();}
  const PILL={new:'<span class="pill new">ใหม่</span>',upd:'<span class="pill upd">ยอดเปลี่ยน</span>',prot:'<span class="pill prot">คงยอดเดิม</span>',same:'<span class="pill same">ไม่เปลี่ยนแปลง</span>'};
  function render(){
    const d=scen[cur], st=d.stats, changed=d.changed.length;
    const card=(cls,l,v)=>`<div class="stat ${v?cls:'zero'}"><small>${l}</small><strong>${v}</strong></div>`;
    document.getElementById('stats').innerHTML =
      card('new','Record ใหม่',st.new)+card('upd','ยอดเปลี่ยน',st.upd)+card('prot','Protected (คงยอดเดิม)',st.prot)+card('bad','ไม่พบ / Parse ไม่ได้',st.bad);
    document.getElementById('total').textContent = changed + d.same;
    document.getElementById('notice').innerHTML = changed===0
      ? `<div class="notice"><span class="ic">✓</span><div><b>ข้อมูลตรงกับใน DB ทั้งหมด</b> — ไม่มีรายการใหม่หรือยอดที่เปลี่ยน การบันทึกจะไม่ทำให้ข้อมูลเปลี่ยน</div></div>` : '';
    const show = document.getElementById('showSame').checked;
    let list = d.changed.slice(); if(show) list = list.concat(same.slice(0,8));
    document.getElementById('rows').innerHTML = list.map(r=>{
      const delta = (r.o!==null && r.s!=='same' && r.n!==r.o) ? `<span class="delta" style="color:${r.n-r.o>0?'#1a7f37':'#cf222e'}">${r.n-r.o>0?'+':''}${fmt(r.n-r.o)}</span>` : '';
      return `<tr class="${r.s==='same'?'same':''}"><td>${r.b}</td><td>${r.a}</td><td class="num old">${r.o===null?'—':fmt(r.o)}</td><td class="num">${fmt(r.n)}${delta}</td><td>${PILL[r.s]}</td></tr>`;
    }).join('');
    document.getElementById('empty').innerHTML = list.length===0
      ? `<div class="empty"><b>ไม่มีรายการที่ต้องตรวจ</b>เปิดสวิตช์ด้านบนหากต้องการดูรายการที่ไม่เปลี่ยนแปลง (${d.same})</div>` : '';
    document.getElementById('barL').textContent = changed ? `รายการที่มีการเปลี่ยนแปลง ${changed} รายการ` : 'รายการที่มีการเปลี่ยนแปลง 0 รายการ';
    document.getElementById('togT').textContent = `แสดงรายการที่ไม่เปลี่ยนแปลง (${d.same})`;
    document.getElementById('hint').textContent = changed ? `จะบันทึก ${st.new+st.upd} รายการ · คงยอดเดิม ${st.prot} รายการ` : 'ไม่มีการเปลี่ยนแปลง';
  }
  render();
</script>
</body>
</html>
