<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup ยืนยันก่อนบันทึก Input Summary</title>
<style>
  :root{
    --bg:#eef1f5; --card:#fff; --ink:#1f2328; --mute:#656d76; --line:#e6e9ed;
    --blue:#0969da; --blue-soft:#ddf0ff; --green:#1a7f37; --green-soft:#e6f4ea;
    --amber:#9a6700; --amber-soft:#fff4d6; --gray-soft:#f3f4f6; --red:#cf222e; --red-soft:#ffebe9;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:"Sarabun","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);padding:24px 16px 48px}
  .switch{display:flex;gap:8px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
  .switch button{border:1px solid #cfd6de;background:#fff;border-radius:999px;padding:7px 16px;font:inherit;font-size:13px;cursor:pointer;color:var(--mute)}
  .switch button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .modal{width:820px;max-width:100%;margin:0 auto;background:var(--card);border-radius:16px;box-shadow:0 12px 40px rgba(20,30,50,.18);overflow:hidden}
  .head{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--line)}
  .head h2{margin:0;font-size:16px;font-weight:600}
  .x{border:0;background:none;font-size:18px;color:var(--mute);cursor:pointer;line-height:1}
  .body{padding:20px 24px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:5px 12px;border-radius:999px;background:var(--gray-soft);color:var(--ink)}
  .chip b{font-weight:600}
  .chip.type{background:var(--blue-soft);color:var(--blue);font-weight:600}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
  .stat{border-radius:12px;padding:12px 14px;background:var(--gray-soft)}
  .stat small{display:block;font-size:12px;color:var(--mute);margin-bottom:2px}
  .stat strong{font-size:24px;font-weight:600;line-height:1.2}
  .stat.new{background:var(--green-soft)} .stat.new strong{color:var(--green)}
  .stat.upd{background:var(--blue-soft)} .stat.upd strong{color:var(--blue)}
  .stat.del{background:var(--amber-soft)} .stat.del strong{color:var(--amber)}
  .stat.bad{background:var(--red-soft)} .stat.bad strong{color:var(--red)}
  .stat.zero{background:var(--gray-soft)} .stat.zero strong{color:#b6bcc4}
  .notice{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:16px}
  .notice .ic{width:22px;height:22px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
  .notice.ok{background:var(--green-soft);color:#14532d} .notice.ok .ic{background:var(--green)}
  .notice.warn{background:var(--amber-soft);color:#5c4100} .notice.warn .ic{background:var(--amber)}
  .notice.err{background:var(--red-soft);color:#82071e} .notice.err .ic{background:var(--red)}
  .bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:13px;color:var(--mute);gap:12px;flex-wrap:wrap}
  .tog{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
  .tog input{display:none}
  .tog i{width:34px;height:20px;border-radius:999px;background:#c8cfd8;position:relative;transition:.15s}
  .tog i:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
  .tog input:checked+i{background:var(--blue)} .tog input:checked+i:after{left:16px}
  .tablewrap{border:1px solid var(--line);border-radius:12px;max-height:300px;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{position:sticky;top:0;background:#f7f8fa;text-align:left;font-weight:600;color:var(--mute);padding:9px 12px;font-size:12px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:9px 12px;border-bottom:1px solid #f0f2f5}
  tr:last-child td{border-bottom:0}
  .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .old{color:var(--mute);text-decoration:line-through;margin-right:6px;font-size:12px}
  .delta{font-size:12px;margin-left:6px}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
  .pill.new{background:var(--green-soft);color:var(--green)}
  .pill.upd{background:var(--blue-soft);color:var(--blue)}
  .pill.del{background:var(--amber-soft);color:var(--amber)}
  .pill.bad{background:var(--red-soft);color:var(--red)}
  .pill.same{background:var(--gray-soft);color:var(--mute);font-weight:500}
  tr.same td{color:var(--mute)}
  tr.bad td{background:#fff8f7}
  .empty{padding:28px 16px;text-align:center;color:var(--mute);font-size:14px}
  .empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px;border-top:1px solid var(--line);background:#fafbfc}
  .foot .hint{font-size:12px;color:var(--mute)}
  .btns{display:flex;gap:8px}
  .btn{font:inherit;font-size:14px;border-radius:10px;padding:9px 18px;cursor:pointer;border:1px solid #cfd6de;background:#fff;color:var(--ink)}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
  .btn.primary[disabled]{background:#b6c9e3;border-color:#b6c9e3;cursor:not-allowed}
  .note{max-width:820px;margin:16px auto 0;font-size:12px;color:var(--mute);text-align:center}
  @media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}.foot{flex-direction:column;align-items:stretch}.btns{justify-content:flex-end}}
</style>
</head>
<body>

<div class="switch">
  <button id="b1" class="on" onclick="show(1)">1) นำเข้าครั้งแรก (แบบในภาพของคุณ)</button>
  <button id="b2" onclick="show(2)">2) นำเข้าซ้ำ มีรายการเปลี่ยน</button>
  <button id="b3" onclick="show(3)">3) มีสาขา Match ไม่ได้</button>
</div>

<div class="modal">
  <div class="head">
    <h2>ยืนยันข้อมูลก่อนบันทึก</h2>
    <button class="x" aria-label="ปิด">✕</button>
  </div>

  <div class="body">
    <div class="chips">
      <span class="chip type">Input Summary</span>
      <span class="chip">BU <b>3218</b></span>
      <span class="chip">Period <b>2026-09</b></span>
      <span class="chip">Tax Type <b>N</b> · Account <b>11610752</b></span>
      <span class="chip">ทั้งหมด <b id="total"></b> ใบกำกับภาษี</span>
    </div>

    <div class="stats" id="stats"></div>
    <div id="notice"></div>

    <div class="bar">
      <span id="barL"></span>
      <label class="tog"><input type="checkbox" id="showSame" onchange="render()"><i></i><span id="togT"></span></label>
    </div>

    <div class="tablewrap">
      <table>
        <thead><tr>
          <th>สาขา</th><th>เลขที่ใบกำกับภาษี</th><th>ชื่อผู้ค้า</th><th class="num">มูลค่าสินค้า</th><th class="num">ภาษี</th><th>สถานะ</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty"></div>
    </div>
  </div>

  <div class="foot">
    <span class="hint" id="hint"></span>
    <div class="btns">
      <button class="btn">ยกเลิก</button>
      <button class="btn primary" id="ok">ยืนยันบันทึกลง DB</button>
    </div>
  </div>
</div>
<p class="note">Mockup เพื่อดูหน้าตาเท่านั้น — ยังไม่ได้แก้โค้ดจริง ตัวเลขเป็นข้อมูลตัวอย่าง</p>

<script>
  const fmt = n => n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  // ข้อมูลตัวอย่าง (จากภาพ)
  const base = [
    ["321801","LBV2699","*โรบินสัน บมจ. สาขามุกดาหาร (LifeStyle)",147870,10350.90],
    ["321801","LBV2700","*โรบินสัน บมจ. สาขามุกดาหาร (LifeStyle)",186825,13077.75],
    ["321801","LBV3662","*โรบินสัน บมจ. สาขาศรีสมาน (LifeStyle)",9900,693],
    ["321801","8898","*โรบินสัน บมจ. สาขาบุรีรัมย์ (LifeStyle)",39040,2732.80],
    ["321801","8897","*โรบินสัน บมจ. สาขาบุรีรัมย์ (LifeStyle)",39040,2732.80],
    ["321801","VGI69070000646","*BTM-บริษัท โคเวย์ (ประเทศไทย) จำกัด",2411.22,168.78],
    ["321801","20260158","*BTM-บริษัท มีเดียเรอร์ จำกัด",2250,157.50],
    ["321801","20260175","*BTM-บริษัท มีเดียเรอร์ จำกัด",3285,229.95]
  ].map(([b,i,v,a,t])=>({b,i,v,a,t,s:"same"}));

  const scen = {
    1:{ // นำเข้าครั้งแรก: DB ยังไม่มีข้อมูล
      total:830, st:{new:830,upd:0,del:0,bad:0},
      notice:`<div class="notice ok"><span class="ic">✓</span><div><b>ข้อมูลชุดนี้ยังไม่เคยบันทึกใน DB</b> — ใบกำกับภาษีทั้ง 830 ใบจะถูกบันทึกเป็นรายการใหม่ ไม่มีข้อมูลเดิมถูกแทนที่</div></div>`,
      changed: base.map(r=>({...r,s:"new"})), hiddenSame:0, moreNew:822,
      hint:"จะบันทึก 830 ใบกำกับภาษี", ok:true },
    2:{ // นำเข้าซ้ำ
      total:831, st:{new:3,upd:2,del:1,bad:0},
      notice:`<div class="notice warn"><span class="ic">!</span><div><b>BU / Period / Tax Type นี้มีข้อมูลเดิมอยู่แล้ว 829 ใบ</b> — การ Commit จะ<b>ลบข้อมูลเดิมทั้งหมด</b>แล้วบันทึกชุดใหม่แทนที่ (Replace ทั้งก้อน ไม่ใช่ Merge) ด้านล่างคือรายการที่ต่างจากเดิม</div></div>`,
      changed:[
        {b:"321801",i:"LBV3701",v:"*โรบินสัน บมจ. สาขามุกดาหาร (LifeStyle)",a:52000,t:3640,s:"new"},
        {b:"321801",i:"LBV3702",v:"*โรบินสัน บมจ. สาขามุกดาหาร (LifeStyle)",a:18400,t:1288,s:"new"},
        {b:"321801",i:"20260312",v:"*BTM-บริษัท มีเดียเรอร์ จำกัด",a:4100,t:287,s:"new"},
        {b:"321801",i:"8898",v:"*โรบินสัน บมจ. สาขาบุรีรัมย์ (LifeStyle)",a:41000,t:2870,oa:39040,ot:2732.80,s:"upd"},
        {b:"321801",i:"15135",v:"*BTM-บจก. อีสบอนน์ คัลเลอร์ กรุ๊พ.",a:1250,t:87.50,oa:1170,ot:81.90,s:"upd"},
        {b:"321801",i:"DTR69-09-03",v:"*BTM-บริษัท ดี ทรี จำกัด",a:6500,t:455,s:"del"} ],
      hiddenSame:825, hint:"จะบันทึก 831 ใบ · ลบออก 1 ใบที่ไม่อยู่ในไฟล์ใหม่", ok:true },
    3:{ // Match สาขาไม่ได้
      total:830, st:{new:828,upd:0,del:0,bad:2},
      notice:`<div class="notice err"><span class="ic">✕</span><div><b>มี 2 ใบที่ Match สาขาไม่ได้</b> — ต้องเพิ่ม/แก้สาขาใน branch_list ก่อน หรือแก้ไฟล์ แล้วอัปโหลดใหม่ จึงจะบันทึกได้</div></div>`,
      changed:[
        {b:"—",i:"IV69/00311",v:"*BTM-บริษัท พี.เอส.พี.เทเลคอม(1989) จำกัด",a:2500,t:175,s:"bad",note:"รหัสสาขา 3218Z9 ไม่พบ"},
        {b:"—",i:"260707790",v:"*BTM-บริษัท อินเทอร์เน็ตประเทศไทย จำกัด (มหาชน)",a:3600,t:252,s:"bad",note:"รหัสสาขา 3218Z9 ไม่พบ"} ],
      hiddenSame:0, moreNew:0, hint:"บันทึกไม่ได้จนกว่าจะแก้ 2 รายการ", ok:false }
  };
  let cur = 1;
  function show(k){cur=k;[1,2,3].forEach(n=>document.getElementById('b'+n).classList.toggle('on',n==k));document.getElementById('showSame').checked=false;render();}
  const PILL={new:'<span class="pill new">ใหม่</span>',upd:'<span class="pill upd">ยอดเปลี่ยน</span>',del:'<span class="pill del">จะถูกลบ</span>',bad:'<span class="pill bad">Match สาขาไม่ได้</span>',same:'<span class="pill same">ไม่เปลี่ยน</span>'};
  const cell=(n,o)=> (o!==undefined && o!==n) ? `<span class="old">${fmt(o)}</span>${fmt(n)}` : fmt(n);
  function render(){
    const d=scen[cur], st=d.st;
    const card=(cls,l,v)=>`<div class="stat ${v?cls:'zero'}"><small>${l}</small><strong>${v.toLocaleString()}</strong></div>`;
    document.getElementById('stats').innerHTML =
      card('new','รายการใหม่',st.new)+card('upd','ยอดเปลี่ยน (แทนที่ข้อมูลเดิม)',st.upd)+card('del','จะถูกลบ (ไม่อยู่ในไฟล์ใหม่)',st.del)+card('bad','สาขาที่ Match ไม่ได้',st.bad);
    document.getElementById('total').textContent = d.total.toLocaleString();
    document.getElementById('notice').innerHTML = d.notice;
    const showSame = document.getElementById('showSame').checked;
    let list = d.changed.slice();
    if(showSame) list = list.concat(base.slice(0,5).map(r=>({...r,s:'same'})));
    document.getElementById('rows').innerHTML = list.map(r=>`<tr class="${r.s==='same'?'same':r.s==='bad'?'bad':''}">
      <td>${r.b}</td><td>${r.i}</td><td>${r.v}${r.note?`<div style="font-size:12px;color:#cf222e">${r.note}</div>`:''}</td>
      <td class="num">${cell(r.a,r.oa)}</td><td class="num">${cell(r.t,r.ot)}</td><td>${PILL[r.s]}</td></tr>`).join('')
      + (cur===1 && !showSame ? `<tr><td colspan="6" style="text-align:center;color:#656d76;padding:12px">… และอีก ${d.moreNew.toLocaleString()} ใบ (เลื่อนดู / ค้นหาได้)</td></tr>`:'');
    document.getElementById('empty').innerHTML='';
    const changed = d.changed.length + (cur===1?d.moreNew:0);
    document.getElementById('barL').textContent = cur===1 ? `รายการที่จะบันทึก ${d.total.toLocaleString()} ใบ` : `รายการที่ต่างจากเดิม ${changed} รายการ`;
    document.getElementById('togT').textContent = d.hiddenSame ? `แสดงรายการที่ไม่เปลี่ยน (${d.hiddenSame.toLocaleString()})` : 'แสดงรายการที่ไม่เปลี่ยน (0)';
    document.getElementById('hint').textContent = d.hint;
    document.getElementById('ok').disabled = !d.ok;
  }
  render();
</script>
</body>
</html>
