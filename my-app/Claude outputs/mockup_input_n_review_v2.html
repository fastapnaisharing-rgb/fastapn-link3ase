<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup Input N ในหัว % v2</title>
<style>
  :root{--bg:#eef1f5;--ink:#1f2328;--mute:#656d76;--line:#e6e9ed;--blue:#0969da;--blue-soft:#ddf0ff;--green:#1a7f37;--green-soft:#e6f4ea;--amber:#9a6700;--amber-soft:#fff4d6;--gray:#f3f4f6}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;color:var(--ink);padding:22px 14px 48px}
  .wrap{max-width:900px;margin:0 auto}
  .card{background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(20,30,50,.12);overflow:hidden}
  .ph{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
  .ph b{font-size:15px}.chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{font-size:12px;padding:4px 11px;border-radius:999px;background:var(--gray)}.chip.t{background:var(--blue-soft);color:var(--blue);font-weight:600}
  .pad{padding:16px 20px}
  .notice{display:flex;gap:12px;background:var(--amber-soft);border:1px solid #f0d78a;border-radius:12px;padding:12px 14px;color:#5c4400;font-size:13px;line-height:1.55}
  .notice .ic{flex:none;width:22px;height:22px;border-radius:50%;background:var(--amber);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
  .notice b{color:#3d2e00}
  .kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
  .k{background:var(--gray);border-radius:12px;padding:10px 14px}.k small{display:block;color:var(--mute);font-size:12px}.k strong{font-size:18px}
  .k.h{background:var(--green-soft)}.k.h strong{color:var(--green)}
  .tw{border:1px solid var(--line);border-radius:12px;overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{background:#f7f8fa;text-align:left;font-size:12px;color:var(--mute);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:9px 12px;border-bottom:1px solid #f0f2f5;vertical-align:middle}
  .n{text-align:right;font-variant-numeric:tabular-nums}
  tr.br{cursor:pointer;background:#fff}tr.br:hover{background:#fafbfc}
  tr.inv td{background:#fbfcfd;color:#444;font-size:12.5px}
  .caret{display:inline-block;width:14px;color:var(--mute);transition:.15s}.open .caret{transform:rotate(90deg)}
  .tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--green-soft);color:var(--green)}
  .mv{font:inherit;font-size:12px;border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
  .mv:hover{background:var(--blue-soft)}
  .mv.sm{padding:3px 9px;font-size:11.5px}
  .foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-top:1px solid var(--line);background:#fafbfc}
  .muted{color:var(--mute);font-size:12px}
  .btn{font:inherit;font-size:14px;border-radius:10px;padding:9px 18px;border:1px solid #cfd6de;background:#fff;cursor:pointer}
  .btn.p{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#1f2328;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%)}
  .okbox{background:var(--green-soft);color:#14532d;border-radius:12px;padding:14px;font-size:14px}
  .note{text-align:center;font-size:12px;color:var(--mute);margin-top:12px}
  .hl{background:var(--blue-soft)!important;transition:background .8s}
  @media(max-width:700px){.kpi{grid-template-columns:1fr}.hide-sm{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="ph">
      <div class="chips"><b style="margin-right:8px">Reconcile Detail</b><span class="chip t">0402 · CFW</span><span class="chip">Period 2026-09</span><span class="chip">หัว % 59.53%</span></div>
    </div>
    <div class="pad">
      <div id="notice"></div>
      <div class="kpi">
        <div class="k"><small>Input A (คิดตามหัว % 59.53%)</small><strong>1,284,310.40</strong></div>
        <div class="k h"><small>Input N → คิด 100% อัตโนมัติ</small><strong id="kN">0.00</strong></div>
        <div class="k"><small>Simple 100</small><strong>0.00</strong></div>
      </div>
      <div id="tbl"></div>
    </div>
    <div class="foot">
      <span class="muted">Export ได้ตลอด — ยอด Input N ถูกคิด 100% ในช่อง 100% ไว้ให้แล้ว</span>
      <div style="display:flex;gap:8px"><button class="btn">ปิด</button><button class="btn p">Export Reconcile</button></div>
    </div>
  </div>
  <p class="note">คลิกแถวสาขาเพื่อดูใบกำกับภาษีรายใบ · ปุ่ม "ย้ายไป Tax Type A" ใช้ได้ทั้งทั้งสาขาและรายใบ</p>
</div>
<div class="toast" id="toast"></div>

<script>
const fmt=n=>n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
let br=[
 {b:"0402H1",open:false,inv:[["03/09/26","RRO260901/0101","บจก. ไทยออฟฟิศซัพพลาย","ค่าวัสดุสำนักงาน",5420.50],["08/09/26","RRO260933/0007","หจก. ซีเอ็นเซอร์วิส","ค่าซ่อมบำรุง",7200.00],["15/09/26","IV2609-0455","บจก. เอ็มพีเน็ต","ค่าอินเทอร์เน็ต",3100.00],["22/09/26","IV2609-0612","บจก. โลจิสติกส์พลัส","ค่าขนส่ง",2700.00]]},
 {b:"0402W2",open:false,inv:[["05/09/26","RRO260910/0033","บจก. คลีนเวิร์ค","ค่าทำความสะอาด",3410.00],["19/09/26","RRO260944/0012","บจก. ซิเคียวริตี้ไพร์ม","ค่ารักษาความปลอดภัย",2900.00]]},
 {b:"0402Y1",open:false,inv:[["11/09/26","IV2609-0188","บจก. ออฟฟิศเมท","ค่าอุปกรณ์สำนักงาน",1250.75]]}
];
const sum=a=>a.reduce((s,x)=>s+x[4],0);
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2600)}
function render(){
  const total=br.reduce((s,x)=>s+sum(x.inv),0), cnt=br.reduce((s,x)=>s+x.inv.length,0);
  document.getElementById('kN').textContent=fmt(total);
  document.getElementById('notice').innerHTML = br.length ? `<div class="notice"><span class="ic">!</span><div><b>พบ Input N ใน BU หัว % — ${br.length} สาขา ${cnt} ใบ รวม ${fmt(total)}</b><br>ระบบคิดเป็น <b>ใช้สิทธิ์ 100%</b> และใส่ช่อง 100% ให้แล้ว หากบันทึก Tax Type ผิด (ควรเป็น A) ให้กด "ย้ายไป Tax Type A" ยอดจะไปคำนวณตามหัว % 59.53% แทน</div></div>` : '';
  if(!br.length){document.getElementById('tbl').innerHTML='<div class="okbox">✓ ไม่เหลือ Input N ที่ต้องตรวจ — ทุกรายการอยู่ในหัว % แล้ว</div>';return;}
  let h='<div class="tw"><table><thead><tr><th>สาขา</th><th class="n">จำนวนใบ</th><th class="n">ภาษีซื้อที่ชำระ</th><th class="n">ใช้สิทธิ์ (100%)</th><th>สถานะ</th><th></th></tr></thead><tbody>';
  br.forEach((x,i)=>{
    const s=sum(x.inv);
    h+=`<tr class="br ${x.open?'open':''}" onclick="tog(${i})"><td><span class="caret">▸</span><b>${x.b}</b></td><td class="n">${x.inv.length}</td><td class="n">${fmt(s)}</td><td class="n">${fmt(s)}</td><td><span class="tag">คิด 100%</span></td><td class="n"><button class="mv" onclick="event.stopPropagation();mvB(${i})">ย้ายทั้งสาขาไป A</button></td></tr>`;
    if(x.open){
      h+=`<tr class="inv"><td colspan="6" style="padding:0"><table style="width:100%"><thead><tr><th>วันที่ใบกำกับ</th><th>เลขที่ใบกำกับ</th><th>ผู้ค้า</th><th class="hide-sm">รายการ</th><th class="n">ภาษีที่ชำระ</th><th></th></tr></thead><tbody>`;
      x.inv.forEach((v,j)=>{h+=`<tr class="inv"><td>${v[0]}</td><td>${v[1]}</td><td>${v[2]}</td><td class="hide-sm">${v[3]}</td><td class="n">${fmt(v[4])}</td><td class="n"><button class="mv sm" onclick="mvI(${i},${j})">ย้ายไป A</button></td></tr>`});
      h+='</tbody></table></td></tr>';
    }
  });
  h+='</tbody></table></div>';
  document.getElementById('tbl').innerHTML=h;
}
function tog(i){br[i].open=!br[i].open;render()}
function mvB(i){const x=br[i];const s=sum(x.inv);br.splice(i,1);toast(`ย้าย ${x.b} (${fmt(s)}) ไป Tax Type A แล้ว → คำนวณตามหัว % 59.53%`);render()}
function mvI(i,j){const v=br[i].inv.splice(j,1)[0];if(!br[i].inv.length)br.splice(i,1);toast(`ย้าย ${v[1]} (${fmt(v[4])}) ไป Tax Type A แล้ว`);render()}
render();
</script>
</body>
</html>
