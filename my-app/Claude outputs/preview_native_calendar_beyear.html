<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>Preview: พ.ศ. ในปฏิทิน (เลียนแบบ Native)</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background:#f2f3f5; padding:30px; }
  .note { max-width:640px; margin:0 auto 20px; font-size:14px; color:#333; background:#fff8e1; border:1px solid #f0c36d; border-radius:8px; padding:12px 16px; }
  .field-row { max-width:640px; margin:0 auto 20px; display:flex; align-items:center; gap:8px; }
  .field-row label { font-size:13px; color:#555; width:110px; }
  .fake-input { border:1px solid #ccc; border-radius:4px; padding:6px 10px; font-size:14px; display:flex; align-items:center; gap:8px; background:#fff; cursor:pointer; }

  /* --- ตัวปฏิทินจำลอง (แทนที่ Native ไปเลย ไม่ใช่ Popup ของ Browser) --- */
  .cal-wrap { max-width:300px; margin:0 auto; background:#fff; border:1px solid #d0d3d8; border-radius:6px; box-shadow:0 6px 18px rgba(16,24,40,.12); overflow:hidden; }
  .cal-header { display:flex; align-items:center; justify-content:center; gap:6px; padding:10px; font-size:14px; font-weight:600; color:#222; cursor:pointer; border-bottom:1px solid #eee; }
  .cal-header:hover { background:#f7f8fa; }

  /* ระดับ 2: Grid เดือน */
  .month-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:2px; padding:10px; }
  .month-cell { text-align:center; padding:10px 0; font-size:13px; border-radius:4px; cursor:pointer; color:#333; }
  .month-cell.sel { border:1px solid #222; font-weight:600; }
  .month-cell:hover { background:#eef3fb; }

  /* ระดับ 3: List ปี -- จุดที่เพิ่ม พ.ศ. */
  .year-list { max-height:230px; overflow-y:auto; padding:6px 0; }
  .year-row { display:flex; align-items:center; justify-content:space-between; padding:8px 14px; font-size:13.5px; color:#222; cursor:pointer; }
  .year-row:hover { background:#eef3fb; }
  .year-row.sel { background:#e3ecfa; font-weight:600; }
  .year-row .be {
    font-size:11.5px;
    color:#b45309;
    font-weight:600;
  }

  .tabs { display:flex; justify-content:center; gap:16px; margin:26px auto 0; max-width:640px; font-size:13px; }
  .tabs button { padding:6px 14px; border:1px solid #ccc; background:#fff; border-radius:6px; cursor:pointer; }
  .tabs button.active { background:#1a3a5c; color:#fff; border-color:#1a3a5c; }
</style>
</head>
<body>

  <div class="note">
    ตัวอย่างนี้คือ <b>ปฏิทินที่สร้างขึ้นเองทั้งหมด</b> (ไม่ใช่ Popup ปฏิทินของ Browser) หน้าตา/สไตล์/Layout เดียวกับของเดิมทุกจุด
    ต่างกันแค่ตรง List ปี (ขั้นที่ 3) จะมี <b>พ.ศ.</b> พ่วงมาให้เห็นด้วย ตรงจุดเดียวกับที่วงไว้ในรูป
  </div>

  <div class="field-row">
    <label>Tax invoice Date</label>
    <div class="fake-input">📅 09/27/2022</div>
  </div>

  <div class="cal-wrap" id="cal">
    <div class="cal-header" id="calHeader">September 2022 ▾</div>
    <div id="calBody"></div>
  </div>

  <div class="tabs">
    <button id="btnMonth" class="active">ดูขั้น: Grid เดือน</button>
    <button id="btnYear">ดูขั้น: List ปี (จุดที่เพิ่ม พ.ศ.)</button>
  </div>

<script>
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const body = document.getElementById('calBody');
  const header = document.getElementById('calHeader');

  function renderMonths(selMonthIdx, year) {
    header.textContent = "September " + year + " ▾";
    body.innerHTML = '<div class="month-grid">' +
      months.map((m,i) => `<div class="month-cell ${i===selMonthIdx?'sel':''}">${m}</div>`).join('') +
      '</div>';
  }

  function renderYears(selYear) {
    header.textContent = "เลือกปี ▾";
    let html = '<div class="year-list">';
    for (let y = selYear - 4; y <= selYear + 4; y++) {
      html += `<div class="year-row ${y===selYear?'sel':''}">
                 <span>${y}</span>
                 <span class="be">พ.ศ. ${y + 543}</span>
               </div>`;
    }
    html += '</div>';
    body.innerHTML = html;
  }

  document.getElementById('btnMonth').onclick = () => {
    renderMonths(8, 2022);
    setActive('btnMonth');
  };
  document.getElementById('btnYear').onclick = () => {
    renderYears(2022);
    setActive('btnYear');
  };
  function setActive(id){
    document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  renderMonths(8, 2022);
</script>

</body>
</html>
