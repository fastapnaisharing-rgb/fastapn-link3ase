<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Draft Monitor Button - v2 (BU นำหน้า + ขยายกว้าง)</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; background: #f5f6f8; padding: 40px; }
  .zone {
    width: 300px;
    min-height: 90px;
    border: 1.5px dashed #ccc;
    border-radius: 10px;
    background: #ffffff;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 20px;
    box-sizing: border-box;
  }
  .caption { margin-top: 14px; font-size: 12.5px; color: #777; line-height: 1.6; max-width: 320px; }
  h2 { font-size: 16px; color: #222; }
</style>
</head>
<body>

  <h2>B2-v2: BU ย้ายมาไว้หน้าสุด + ปุ่มขยายกว้างขึ้น (Navy)</h2>

  <div class="zone">
    <div style="position:relative; width:260px;">
      <button type="button" style="width:100%; display:flex; align-items:center; justify-content:flex-start; gap:10px; padding:9px 14px; font-size:13.5px; border-radius:22px; border:none; background:#1a3a5c; color:#fff; cursor:pointer; font-weight:500;">
        <span style="background:#2e5a86; border-radius:12px; padding:3px 9px; font-size:12px; font-weight:600; display:flex; align-items:center; gap:4px;">REV <span style="opacity:0.7; font-size:9px;">1|2</span><span style="opacity:0.8; font-size:9px; margin-left:2px;">▾</span></span>
        <span style="flex:1;">Draft Monitor</span>
      </button>
      <select style="position:absolute; left:8px; top:0; bottom:0; width:70px; opacity:0; cursor:pointer;">
        <option>REV (1|2)</option>
        <option>MPS (0|3)</option>
      </select>
    </div>
  </div>

  <div class="caption">
    Chip "REV 1|2" ย้ายมาไว้หน้าสุดของปุ่ม (ซ้ายมือ) ตัวปุ่มขยายกว้างขึ้น (260px) คำว่า "Draft Monitor" อยู่ฝั่งขวา<br/>
    กดตรง Chip (โซนซ้าย) จะเปิด Dropdown เลือก BU ได้ (Select โปร่งใสซ้อนอยู่เฉพาะโซนนั้น) กดฝั่งขวาจะเปิด Draft Monitor Modal
  </div>

</body>
</html>
